<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RYterminal Toolbox · Herramientas de informática</title><link rel="icon" href="assets/logo/logo.png"><link rel="stylesheet" href="css/style.css"></head><body>
<header class="top"><a class="logo" id="home"><img src="assets/logo/logo.png" width="38" height="38" alt=""><span><b>RY</b>terminal</span><small>ENTORNO INFORMÁTICO</small></a><span class="system-live"><i></i>SISTEMA ACTIVO</span><button id="command-open" class="command-trigger" type="button" aria-label="Buscar herramientas y acciones" aria-haspopup="dialog"><span>Buscar herramientas y acciones</span><kbd>Ctrl K</kbd></button></header>
<main>
<section id="landing" class="scr on command-home"><div id="command-center" class="command-center-root"></div></section>
<section id="choose" class="scr center"><div class="hero"><h2>¿Qué quieres practicar?</h2><div class="grid"><button class="opt" data-pick="linux"><span>🐧</span><b>Linux</b><small>Terminal Linux simulada</small></button><button class="opt" data-pick="win"><span>🪟</span><b>Windows</b><small>CMD o PowerShell</small></button></div>
<div id="wsub" hidden><p class="mut">Elige el intérprete de Windows</p><div class="grid"><button class="opt" data-pick="cmd"><b>CMD</b><small>Símbolo del sistema</small></button><button class="opt" data-pick="ps"><b>PowerShell</b><small>Cmdlets y objetos</small></button></div></div></div></section>
<section id="app" class="scr col" data-view="terminal">
<div class="bar"><button id="toolbox-back">← Toolbox</button><div class="chips" id="chips"></div><div class="tabs" id="tabs"><button data-v="terminal">Libre</button><button data-v="library">Biblioteca</button><button data-v="challenges">Retos</button><button data-v="tools">Herramientas</button></div><div class="acts"><button id="shot">📸 Descargar captura</button><button id="reset">↺ Reiniciar</button></div></div>
<div id="v-challenges" class="panel"><div id="chal"></div></div>
<div id="v-library" class="panel lib"><div class="crow"><input id="q" placeholder="Buscar comando…"><select id="lsys"><option value="">Todos</option><option value="linux">Linux</option><option value="cmd">CMD</option><option value="ps">PowerShell</option></select></div><div class="chips" id="lcats"></div><div id="llist"></div></div>
<div id="v-tools" class="panel tools-panel"><div class="toolnav" id="toolnav"></div><div id="toolhost"></div></div>
<div class="term"><div class="win" id="win"><div class="wbar"><i></i><i></i><i></i><span id="wtitle">RYterminal</span></div><div id="sc"><div id="out"></div><label class="inl"><span id="pr"></span><input id="inp" autocomplete="off" spellcheck="false" autocapitalize="off" aria-label="Terminal"></label></div></div></div>
</section></main>
<script src="js/filesystem.js"></script><script src="js/terminal.js"></script>
<script src="js/commands/linux.js"></script><script src="js/commands/cmd.js"></script><script src="js/commands/powershell.js"></script>
<script src="data/library.js"></script><script src="data/challenges.js"></script><script src="js/challenges.js"></script><script src="js/screenshot.js"></script>
<script src="js/tools/common.js"></script><script src="js/tools/code-editor.js"></script><script src="js/tools/numbers.js"></script><script src="js/tools/ascii.js"></script><script src="js/tools/storage.js"></script><script src="js/tools/units.js"></script><script src="js/tools/html-live.js"></script><script src="js/tools/xml-studio.js"></script><script src="js/tools/json-studio.js"></script>
<script src="js/network/ipv4.js"></script><script src="js/network/model.js"></script><script src="js/network/routing.js"></script><script src="js/network/arp.js"></script><script src="js/network/switching.js"></script><script src="js/network/ping.js"></script><script src="js/network/renderer.js"></script><script src="js/network/topology-storage.js"></script><script src="js/network/network-simulator.js"></script>
<script src="js/tools/catalog.js"></script><script src="js/tools/command-center.js"></script><script src="js/app.js"></script><script src="js/tools/command-palette.js"></script></body></html>
